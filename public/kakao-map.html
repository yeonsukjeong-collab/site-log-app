<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
    #overlayLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    #coordPanel {
      display: none;
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: -apple-system, Roboto, sans-serif;
      font-size: 11px;
      line-height: 1.3;
      color: #111;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    #coordPanel .row {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
    }
    #btnMyLocation {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }
    #btnMyLocation:active {
      background: #eef1f5;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="overlayLayer"></div>
  <div id="coordPanel"></div>
  <button id="btnMyLocation" title="내 위치로 이동">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3" fill="#3478f6"/>
      <path d="M12 2V5M12 19V22M2 12H5M19 12H22" stroke="#3478f6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="7" stroke="#3478f6" stroke-width="1.5"/>
    </svg>
  </button>
  <script>
    var DEFAULT_CENTER = { lat: 37.5665, lng: 126.978 }; // 서울시청 (첫 GPS fix 전 기본값)

    // 좌표 박스를 탭하면 숨긴다. 지도의 다른 곳을 다시 탭하면 handleMapClick이 다시 채우고 보여준다.
    document.getElementById('coordPanel').addEventListener('click', function () {
      this.style.display = 'none';
    });

    // 현재 위치(파란 점)로 지도 중심을 다시 옮긴다. GPS 위치는 부모 창이 setUserLocation()으로
    // 계속 넣어주므로, 아직 한 번도 못 받았으면 userMarker가 없다.
    document.getElementById('btnMyLocation').addEventListener('click', function () {
      if (!map || !userMarker) {
        reportError('아직 현재 위치를 확인하지 못했습니다.');
        return;
      }
      map.setCenter(userMarker.getPosition());
    });

    // React Native WebView 안이면 그쪽 브리지로, 일반 브라우저에서 iframe으로 열렸으면
    // 부모 창(window.parent)으로 보낸다. (site_log_web은 후자 경로를 쓴다.)
    function notifyParent(msg) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      } else if (window.parent && window.parent !== window) {
        window.parent.postMessage(msg, window.location.origin);
      }
    }
    function reportError(message) {
      notifyParent({ type: 'error', message: message });
    }
    function reportDebug(message) {
      notifyParent({ type: 'debug', message: message });
    }
    window.onerror = function (message) {
      reportError('window.onerror: ' + message);
    };
    window.alert = function (message) {
      reportError('카카오 SDK alert: ' + message);
    };

    var appKey = new URLSearchParams(window.location.search).get('key');
    reportDebug('location.href = ' + location.href);

    if (!appKey) {
      reportError('URL에 key 파라미터가 없습니다.');
    } else {
      var script = document.createElement('script');
      script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(appKey) + '&autoload=false';
      script.onerror = function () {
        reportError('카카오맵 SDK <script> 태그 로드 실패 (network error 이벤트 발생)');
      };
      script.onload = function () {
        if (typeof kakao === 'undefined' || !kakao.maps) {
          reportError('스크립트는 로드됐지만 kakao 객체가 없습니다.');
          return;
        }
        kakao.maps.load(initMap);
      };
      document.head.appendChild(script);
    }

    var map = null;
    var userMarker = null;
    var accuracyCircle = null;
    var hasCenteredOnUser = false;
    var tapMarker = null;
    var userPath = [];
    var userPathUtm = []; // userPath와 나란히 쌓는 UTM-K 좌표 (captureSnapshot에서 씀)
    var userTrail = null;
    var isTracking = false;
    var lastTrackedUtm = null; // 직전에 궤적에 찍은 지점(UTM-K), 중복/노이즈 좌표 걸러내는 데 씀

    // 부모 창(site_log_web)에서 영상 촬영 시작/종료에 맞춰 직접 호출한다
    // (mapIframeRef.current.contentWindow.startTracking() / .finishTracking()).
    function startTracking() {
      isTracking = true;
      userPath = [];
      userPathUtm = [];
      lastTrackedUtm = null;
      if (userTrail) {
        userTrail.setMap(null);
        userTrail = null;
      }
    }

    function finishTracking() {
      isTracking = false;
    }

    // WGS84 위경도 -> UTM-K(EPSG:5179, GRS80) 투영좌표 변환.
    // Snyder Transverse Mercator 정방향 공식 사용, 국내 범위에서 서브미터 정밀도.
    function latLngToUtmK(lat, lng) {
      var a = 6378137.0; // GRS80 장반경
      var f = 1 / 298.257222101; // GRS80 편평률
      var e2 = f * (2 - f);
      var e4 = e2 * e2;
      var e6 = e4 * e2;
      var ep2 = e2 / (1 - e2);

      var lat0 = (38 * Math.PI) / 180;
      var lon0 = (127.5 * Math.PI) / 180;
      var k0 = 0.9996;
      var falseEasting = 1000000;
      var falseNorthing = 2000000;

      function meridianArc(phi) {
        var A0 = 1 - e2 / 4 - (3 * e4) / 64 - (5 * e6) / 256;
        var B0 = (3 / 8) * (e2 + e4 / 4 + (15 * e6) / 128);
        var C0 = (15 / 256) * (e4 + (3 * e6) / 4);
        var D0 = (35 / 3072) * e6;
        return a * (A0 * phi - B0 * Math.sin(2 * phi) + C0 * Math.sin(4 * phi) - D0 * Math.sin(6 * phi));
      }

      var latRad = (lat * Math.PI) / 180;
      var lonRad = (lng * Math.PI) / 180;

      var M = meridianArc(latRad);
      var M0 = meridianArc(lat0);

      var sinLat = Math.sin(latRad);
      var cosLat = Math.cos(latRad);
      var tanLat = Math.tan(latRad);

      var N = a / Math.sqrt(1 - e2 * sinLat * sinLat);
      var T = tanLat * tanLat;
      var C = ep2 * cosLat * cosLat;
      var Adash = (lonRad - lon0) * cosLat;

      var easting =
        k0 *
          N *
          (Adash +
            ((1 - T + C) * Math.pow(Adash, 3)) / 6 +
            ((5 - 18 * T + T * T + 72 * C - 58 * ep2) * Math.pow(Adash, 5)) / 120) +
        falseEasting;

      var northing =
        k0 *
          (M -
            M0 +
            N *
              tanLat *
              (Math.pow(Adash, 2) / 2 +
                ((5 - T + 9 * C + 4 * C * C) * Math.pow(Adash, 4)) / 24 +
                ((61 - 58 * T + T * T + 600 * C - 330 * ep2) * Math.pow(Adash, 6)) / 720)) +
        falseNorthing;

      return { x: easting, y: northing };
    }

    // UTM-K(EPSG:5179, GRS80) 투영좌표 -> WGS84 위경도 역변환.
    // Footpoint latitude를 이용한 표준 Transverse Mercator 역해법 (Snyder 공식).
    function utmKToLatLng(x, y) {
      var a = 6378137.0;
      var f = 1 / 298.257222101;
      var e2 = f * (2 - f);
      var e4 = e2 * e2;
      var e6 = e4 * e2;
      var ep2 = e2 / (1 - e2);

      var lat0 = (38 * Math.PI) / 180;
      var lon0 = (127.5 * Math.PI) / 180;
      var k0 = 0.9996;
      var falseEasting = 1000000;
      var falseNorthing = 2000000;

      function meridianArc(phi) {
        var A0 = 1 - e2 / 4 - (3 * e4) / 64 - (5 * e6) / 256;
        var B0 = (3 / 8) * (e2 + e4 / 4 + (15 * e6) / 128);
        var C0 = (15 / 256) * (e4 + (3 * e6) / 4);
        var D0 = (35 / 3072) * e6;
        return a * (A0 * phi - B0 * Math.sin(2 * phi) + C0 * Math.sin(4 * phi) - D0 * Math.sin(6 * phi));
      }

      var M0 = meridianArc(lat0);
      var M = M0 + (y - falseNorthing) / k0;

      var e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2));
      var mu = M / (a * (1 - e2 / 4 - (3 * e4) / 64 - (5 * e6) / 256));

      var footLat =
        mu +
        ((3 * e1) / 2 - (27 * Math.pow(e1, 3)) / 32) * Math.sin(2 * mu) +
        ((21 * e1 * e1) / 16 - (55 * Math.pow(e1, 4)) / 32) * Math.sin(4 * mu) +
        ((151 * Math.pow(e1, 3)) / 96) * Math.sin(6 * mu) +
        ((1097 * Math.pow(e1, 4)) / 512) * Math.sin(8 * mu);

      var sinFoot = Math.sin(footLat);
      var cosFoot = Math.cos(footLat);
      var tanFoot = Math.tan(footLat);

      var N1 = a / Math.sqrt(1 - e2 * sinFoot * sinFoot);
      var T1 = tanFoot * tanFoot;
      var C1 = ep2 * cosFoot * cosFoot;
      var R1 = (a * (1 - e2)) / Math.pow(1 - e2 * sinFoot * sinFoot, 1.5);
      var D = (x - falseEasting) / (N1 * k0);

      var lat =
        footLat -
        ((N1 * tanFoot) / R1) *
          (Math.pow(D, 2) / 2 -
            ((5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * Math.pow(D, 4)) / 24 +
            ((61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * Math.pow(D, 6)) / 720);

      var lon =
        lon0 +
        (D -
          ((1 + 2 * T1 + C1) * Math.pow(D, 3)) / 6 +
          ((5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * Math.pow(D, 5)) / 120) /
          cosFoot;

      return { lat: (lat * 180) / Math.PI, lng: (lon * 180) / Math.PI };
    }

    // 최초 로드 시 자동으로 띄워볼 도면 목록 (?drawing= 파라미터, 단독 테스트/gps-dwg-mapping 앱용).
    // site_log_web은 이 파라미터 대신 postMessage({type:'renderDrawing', ...})로 도면을 넣어준다.
    var DRAWING_FILES = new URLSearchParams(window.location.search).getAll('drawing');

    var activeOverlays = []; // renderDrawingData()로 그린 Polygon/Polyline들, clearDrawingOverlays()로 지움

    function clearDrawingOverlays() {
      activeOverlays.forEach(function (overlay) { overlay.setMap(null); });
      activeOverlays = [];
    }

    // { polylines: [[[x,y],...], ...], hull: [[x,y],...] } (UTM-K 좌표) 하나를 지도 위에 그림.
    // 반환값: { bounds, count } — 호출부에서 여러 개를 합쳐 setBounds 하거나 drawingLoaded 개수를 셀 때 씀.
    function renderDrawingData(data) {
      var bounds = new kakao.maps.LatLngBounds();
      var hasBoundsPoint = false;

      if (Array.isArray(data.hull) && data.hull.length >= 3) {
        var hullPath = data.hull.map(function (pt) {
          var ll = utmKToLatLng(pt[0], pt[1]);
          return new kakao.maps.LatLng(ll.lat, ll.lng);
        });
        var hullPolygon = new kakao.maps.Polygon({
          map: map,
          path: hullPath,
          fillColor: '#ffffff',
          fillOpacity: 1,
          strokeWeight: 1,
          strokeColor: '#ffffff',
          strokeOpacity: 1,
          zIndex: 1,
        });
        activeOverlays.push(hullPolygon);
      }

      (data.polylines || []).forEach(function (polyline) {
        if (polyline.length < 2) return;
        var path = polyline.map(function (pt) {
          var ll = utmKToLatLng(pt[0], pt[1]);
          var latlng = new kakao.maps.LatLng(ll.lat, ll.lng);
          bounds.extend(latlng);
          hasBoundsPoint = true;
          return latlng;
        });
        var line = new kakao.maps.Polyline({
          map: map,
          path: path,
          strokeWeight: 2,
          strokeColor: '#444444',
          strokeOpacity: 0.85,
          strokeStyle: 'solid',
          zIndex: 2,
        });
        activeOverlays.push(line);
      });

      return { bounds: bounds, hasBoundsPoint: hasBoundsPoint, count: (data.polylines || []).length };
    }

    function loadDwgOverlay() {
      var bounds = new kakao.maps.LatLngBounds();
      var hasBoundsPoint = false;
      var totalPolylines = 0;
      var pending = DRAWING_FILES.length;
      if (pending === 0) return;

      DRAWING_FILES.forEach(function (url) {
        fetch(url)
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            var result = renderDrawingData(data);
            if (result.hasBoundsPoint) { bounds = mergeBounds(bounds, result.bounds); hasBoundsPoint = true; }
            totalPolylines += result.count;
          })
          .catch(function (err) {
            reportError('도면 로드 실패 (' + url + '): ' + (err && err.message ? err.message : err));
          })
          .then(function () {
            pending -= 1;
            if (pending === 0) {
              if (hasBoundsPoint) map.setBounds(bounds);
              notifyParent({ type: 'drawingLoaded', count: totalPolylines });
            }
          });
      });
    }

    function mergeBounds(a, b) {
      var merged = new kakao.maps.LatLngBounds(a.getSouthWest(), a.getNorthEast());
      merged.extend(b.getSouthWest());
      merged.extend(b.getNorthEast());
      return merged;
    }

    // ==========================================
    // 위치좌표(GeoTIFF) 래스터 오버레이 — 큰 DWG가 안 열릴 때의 대안 경로.
    // 카카오맵 SDK에는 구글맵 GroundOverlay 같은 기능이 없어서, bbox의 네 모서리를
    // containerPointFromCoords로 매 pan/zoom마다 화면 픽셀로 다시 계산해 <img>를 절대위치로 맞춘다.
    // ==========================================
    var tiffOverlayDiv = null;
    var tiffOverlayImgEl = null; // captureSnapshot()에서 캔버스로 다시 그릴 때 씀 (이 시점엔 이미 로드 완료 상태)
    var tiffOverlayBBox = null; // { minX, minY, maxX, maxY } (UTM-K)

    function clearTiffOverlay() {
      if (tiffOverlayDiv) { tiffOverlayDiv.remove(); tiffOverlayDiv = null; }
      tiffOverlayImgEl = null;
      tiffOverlayBBox = null;
    }

    function renderTiffOverlay(imageDataUrl, bbox) {
      clearTiffOverlay();
      tiffOverlayBBox = bbox;
      tiffOverlayDiv = document.createElement('div');
      tiffOverlayDiv.style.position = 'absolute';
      tiffOverlayDiv.style.pointerEvents = 'none';
      tiffOverlayDiv.style.zIndex = 1;
      tiffOverlayDiv.style.border = '4px solid red'; // 디버그용 — 오버레이 박스의 실제 크기/위치를 눈으로 확인
      var img = document.createElement('img');
      // 디버그: 이미지(큰 data URL) 자체가 원인인지 가리기 위해 잠시 src를 안 채운다.
      // img.src = imageDataUrl;
      img.style.width = '100%';
      img.style.height = '100%';
      img.style.opacity = '0.85';
      tiffOverlayImgEl = img;
      tiffOverlayDiv.appendChild(img);
      document.getElementById('overlayLayer').appendChild(tiffOverlayDiv);
      positionTiffOverlay();

      // 이미지 bbox에 화면을 딱 맞추면 여백이 없어서 주변 지도가 안 보인다. setBounds에
      // 넘길 범위만 30% 더 넓혀서 자연스럽게 여백이 생기게 한다 (setLevel을 별도로 또
      // 호출하면 타일이 깨지는 문제가 있어 이 방식으로 대신함).
      var padX = (bbox.maxX - bbox.minX) * 0.3;
      var padY = (bbox.maxY - bbox.minY) * 0.3;
      var sw = utmKToLatLng(bbox.minX - padX, bbox.minY - padY);
      var ne = utmKToLatLng(bbox.maxX + padX, bbox.maxY + padY);
      return new kakao.maps.LatLngBounds(new kakao.maps.LatLng(sw.lat, sw.lng), new kakao.maps.LatLng(ne.lat, ne.lng));
    }

    function positionTiffOverlay() {
      if (!tiffOverlayDiv || !tiffOverlayBBox || !map) return;
      var proj = map.getProjection();
      var sw = utmKToLatLng(tiffOverlayBBox.minX, tiffOverlayBBox.minY);
      var ne = utmKToLatLng(tiffOverlayBBox.maxX, tiffOverlayBBox.maxY);
      var swPt = proj.containerPointFromCoords(new kakao.maps.LatLng(sw.lat, sw.lng));
      var nePt = proj.containerPointFromCoords(new kakao.maps.LatLng(ne.lat, ne.lng));
      tiffOverlayDiv.style.left = Math.min(swPt.x, nePt.x) + 'px';
      tiffOverlayDiv.style.top = Math.min(swPt.y, nePt.y) + 'px';
      tiffOverlayDiv.style.width = Math.abs(nePt.x - swPt.x) + 'px';
      tiffOverlayDiv.style.height = Math.abs(swPt.y - nePt.y) + 'px';
      reportDebug('tiffOverlay left=' + tiffOverlayDiv.style.left + ' top=' + tiffOverlayDiv.style.top + ' width=' + tiffOverlayDiv.style.width + ' height=' + tiffOverlayDiv.style.height + ' mapSize=' + document.getElementById('map').clientWidth + 'x' + document.getElementById('map').clientHeight);
    }

    var lastDrawingData = null; // { polylines, hull } (UTM-K), captureSnapshot에서 다시 쓰려고 보관

    // 부모 창(site_log_web)에서 오는 메시지: 미리 변환해둔 등록 도면이든, 방금 ACC에서
    // 골라 브라우저에서 즉석 파싱한 DWG/TIFF든 전부 이 경로로 들어온다.
    window.addEventListener('message', function (event) {
      var msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'renderDrawing') {
        lastDrawingData = { polylines: msg.polylines, hull: msg.hull };
        clearDrawingOverlays();
        clearTiffOverlay();
        var result = renderDrawingData(msg);
        if (result.hasBoundsPoint && map) map.setBounds(result.bounds);
        notifyParent({ type: 'drawingLoaded', count: result.count });
      } else if (msg.type === 'renderTiffOverlay') {
        lastDrawingData = null;
        clearDrawingOverlays();
        var tiffBounds = renderTiffOverlay(msg.imageDataUrl, msg.bbox);
        if (map) map.setBounds(tiffBounds);
        notifyParent({ type: 'drawingLoaded', count: 1 });
      } else if (msg.type === 'clearDrawing') {
        lastDrawingData = null;
        clearDrawingOverlays();
        clearTiffOverlay();
      } else if (msg.type === 'captureSnapshot') {
        captureSnapshot().then(function (dataUrl) {
          notifyParent({ type: 'snapshot', dataUrl: dataUrl });
        });
      }
    });

    // 위경도 -> 슬리피맵 표준 월드 픽셀 좌표 (타일 256px 기준, EPSG:3857/Web Mercator).
    function lonLatToWorldPixel(lon, lat, zoom) {
      var n = Math.pow(2, zoom);
      var x = (lon + 180) / 360 * n * 256;
      var latRad = (lat * Math.PI) / 180;
      var y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n * 256;
      return { x: x, y: y };
    }

    // CARTO의 무료 베이스맵 타일(CORS 허용, 웹 지도 임베드 용도로 공개 제공됨)을 배경으로
    // 쓴다. OSM 자체 타일 서버(tile.openstreetmap.org)는 이런 자동/임베드성 요청을 정책상
    // 차단/제한하는 경우가 많아서 대신 이걸 쓴다. 실패해도 null로 resolve해서 나머지
    // 타일/오버레이는 계속 그린다.
    function loadTileImage(z, x, y) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function () { resolve(img); };
        img.onerror = function () {
          reportDebug('captureSnapshot: 타일 로드 실패 z=' + z + ' x=' + x + ' y=' + y);
          resolve(null);
        };
        img.src = 'https://basemaps.cartocdn.com/light_all/' + z + '/' + x + '/' + y + '.png';
      });
    }

    // 도면 hull/polylines + 촬영 중 이동 경로(전부 UTM-K)를 위경도로 바꿔서, 그 범위를
    // 덮는 OpenStreetMap 타일을 배경으로 깔고 그 위에 도면/경로를 그려 PDF용 이미지를 만든다.
    // (카카오 지도 타일 자체는 CORS 때문에 캡처가 안 돼서 OSM 타일을 대신 쓴다.)
    async function captureSnapshot() {
      var allPoints = [];
      var hull = (lastDrawingData && lastDrawingData.hull) || [];
      var polylines = (lastDrawingData && lastDrawingData.polylines) || [];
      hull.forEach(function (p) { allPoints.push(p); });
      polylines.forEach(function (pl) { pl.forEach(function (p) { allPoints.push(p); }); });
      userPathUtm.forEach(function (p) { allPoints.push([p.x, p.y]); });
      if (tiffOverlayBBox) {
        allPoints.push([tiffOverlayBBox.minX, tiffOverlayBBox.minY]);
        allPoints.push([tiffOverlayBBox.maxX, tiffOverlayBBox.maxY]);
      }

      if (allPoints.length === 0) return null;

      var minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
      allPoints.forEach(function (p) {
        var ll = utmKToLatLng(p[0], p[1]);
        minLon = Math.min(minLon, ll.lng); maxLon = Math.max(maxLon, ll.lng);
        minLat = Math.min(minLat, ll.lat); maxLat = Math.max(maxLat, ll.lat);
      });
      var lonPad = (maxLon - minLon) * 0.15 || 0.001;
      var latPad = (maxLat - minLat) * 0.15 || 0.001;
      minLon -= lonPad; maxLon += lonPad; minLat -= latPad; maxLat += latPad;

      var W = 1000, H = 1300, MARGIN = 40, ATTR_H = 24;
      var zoom = 19, p1, p2;
      for (; zoom >= 1; zoom--) {
        p1 = lonLatToWorldPixel(minLon, maxLat, zoom); // 좌상단 (위도가 클수록 위쪽)
        p2 = lonLatToWorldPixel(maxLon, minLat, zoom); // 우하단
        if (p2.x - p1.x <= W - MARGIN * 2 && p2.y - p1.y <= H - MARGIN * 2 - ATTR_H) break;
      }
      var offsetX = (W - (p2.x - p1.x)) / 2 - p1.x;
      var offsetY = (H - ATTR_H - (p2.y - p1.y)) / 2 - p1.y;

      // UTM-K 점을 캔버스 픽셀로: 위경도로 변환 후 같은 월드픽셀 좌표계로 투영.
      function toPx(pt) {
        var ll = utmKToLatLng(pt[0], pt[1]);
        var wp = lonLatToWorldPixel(ll.lng, ll.lat, zoom);
        return [wp.x + offsetX, wp.y + offsetY];
      }

      var canvas = document.createElement('canvas');
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f5f6f7';
      ctx.fillRect(0, 0, W, H);

      var tileMinX = Math.floor(p1.x / 256), tileMaxX = Math.floor(p2.x / 256);
      var tileMinY = Math.floor(p1.y / 256), tileMaxY = Math.floor(p2.y / 256);
      var tileCols = tileMaxX - tileMinX + 1, tileRows = tileMaxY - tileMinY + 1;
      if (tileCols * tileRows <= 64) {
        var tileJobs = [];
        for (var tx = tileMinX; tx <= tileMaxX; tx++) {
          for (var ty = tileMinY; ty <= tileMaxY; ty++) {
            (function (tx, ty) {
              tileJobs.push(loadTileImage(zoom, tx, ty).then(function (img) {
                if (!img) return;
                ctx.drawImage(img, tx * 256 + offsetX, ty * 256 + offsetY, 256, 256);
              }));
            })(tx, ty);
          }
        }
        await Promise.all(tileJobs);
      } else {
        reportDebug('captureSnapshot: 타일 개수 초과(' + (tileCols * tileRows) + ')로 배경 지도 생략');
      }

      if (tiffOverlayBBox && tiffOverlayImgEl) {
        var tl = toPx([tiffOverlayBBox.minX, tiffOverlayBBox.maxY]);
        var br = toPx([tiffOverlayBBox.maxX, tiffOverlayBBox.minY]);
        try {
          ctx.drawImage(tiffOverlayImgEl, tl[0], tl[1], br[0] - tl[0], br[1] - tl[1]);
        } catch (e) {
          reportDebug('captureSnapshot: TIFF 이미지 그리기 실패: ' + (e && e.message ? e.message : e));
        }
      }

      if (hull.length >= 3) {
        ctx.beginPath();
        hull.forEach(function (p, i) {
          var px = toPx(p);
          if (i === 0) ctx.moveTo(px[0], px[1]); else ctx.lineTo(px[0], px[1]);
        });
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#b0b6bb';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      ctx.strokeStyle = '#8a8f94';
      ctx.lineWidth = 1.5;
      polylines.forEach(function (pl) {
        if (pl.length < 2) return;
        ctx.beginPath();
        pl.forEach(function (p, i) {
          var px = toPx(p);
          if (i === 0) ctx.moveTo(px[0], px[1]); else ctx.lineTo(px[0], px[1]);
        });
        ctx.stroke();
      });

      if (userPathUtm.length >= 2) {
        ctx.strokeStyle = '#3478f6';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        userPathUtm.forEach(function (p, i) {
          var px = toPx([p.x, p.y]);
          if (i === 0) ctx.moveTo(px[0], px[1]); else ctx.lineTo(px[0], px[1]);
        });
        ctx.stroke();
      }
      if (userPathUtm.length >= 1) {
        var startPx = toPx([userPathUtm[0].x, userPathUtm[0].y]);
        var endPx = toPx([userPathUtm[userPathUtm.length - 1].x, userPathUtm[userPathUtm.length - 1].y]);
        ctx.fillStyle = '#2ECC71';
        ctx.beginPath(); ctx.arc(startPx[0], startPx[1], 9, 0, 2 * Math.PI); ctx.fill();
        ctx.fillStyle = '#E74C3C';
        ctx.beginPath(); ctx.arc(endPx[0], endPx[1], 9, 0, 2 * Math.PI); ctx.fill();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(0, H - ATTR_H, W, ATTR_H);
      ctx.fillStyle = '#333';
      ctx.font = '12px sans-serif';
      ctx.fillText('© OpenStreetMap contributors © CARTO', 8, H - 8);

      return canvas.toDataURL('image/png');
    }

    function initMap() {
      try {
        var container = document.getElementById('map');
        var options = {
          center: new kakao.maps.LatLng(DEFAULT_CENTER.lat, DEFAULT_CENTER.lng),
          level: 3,
        };
        map = new kakao.maps.Map(container, options);
        kakao.maps.event.addListener(map, 'click', handleMapClick);
        kakao.maps.event.addListener(map, 'zoom_changed', positionTiffOverlay);
        kakao.maps.event.addListener(map, 'center_changed', positionTiffOverlay);
        window.addEventListener('resize', function () { if (map) map.relayout(); });
        // iframe 안에서는 초기화 시점에 컨테이너 크기가 아직 자리잡지 않은 채로 지도가 뜰 수
        // 있어(타일이 안 보이거나 깨져 보임, 콘솔 에러는 없음) — 다음 틱에 relayout으로 재측정.
        setTimeout(function () {
          if (!map) return;
          map.relayout();
          map.setCenter(options.center);
        }, 0);
        loadDwgOverlay();
        notifyParent({ type: 'ready' });
        // RN WebView 안이거나, site_log_web처럼 iframe으로 열려서 부모 창이 있는 경우는
        // 그쪽이 window.setUserLocation()을 직접 호출해서 위치를 넣어준다 (모바일 브라우저가
        // iframe 안의 watchPosition을 백그라운드 취급해 멈추는 문제를 피하기 위함).
        // 정말 이 페이지를 단독으로 열었을 때만 여기서 직접 GPS를 구독한다.
        if (!window.ReactNativeWebView && window.parent === window) {
          startBrowserGeolocation();
        }
      } catch (error) {
        reportError('initMap 실패: ' + (error && error.message ? error.message : error));
      }
    }

    // 이 페이지를 단독으로(부모 창 없이) 열었을 때만 쓰는 폴백.
    function startBrowserGeolocation() {
      if (!navigator.geolocation) {
        reportError('이 브라우저는 GPS(geolocation)를 지원하지 않습니다.');
        return;
      }
      navigator.geolocation.watchPosition(
        function (pos) {
          setUserLocation(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
        },
        function (err) {
          reportError('브라우저 GPS 오류: ' + err.message);
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    function handleMapClick(mouseEvent) {
      var latlng = mouseEvent.latLng;
      var lat = latlng.getLat();
      var lng = latlng.getLng();
      var utmk = latLngToUtmK(lat, lng);

      if (!tapMarker) {
        // 정확한 지점을 짚어주는 십자(+) 모양. 흰 테두리를 먼저 굵게 깔고 그 위에 빨간
        // 십자를 그려서 어떤 배경에서도 잘 보이게 하고, 십자의 정중앙이 탭한 좌표가
        // 되도록 offset을 이미지 정중앙(12,12)으로 맞춘다.
        var tapMarkerSvg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24">' +
          '<g stroke="white" stroke-width="5" stroke-linecap="round">' +
          '<line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>' +
          '</g>' +
          '<g stroke="#e53935" stroke-width="2.5" stroke-linecap="round">' +
          '<line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/>' +
          '</g>' +
          '</svg>';
        tapMarker = new kakao.maps.Marker({
          position: latlng,
          map: map,
          image: new kakao.maps.MarkerImage(
            'data:image/svg+xml;base64,' + btoa(tapMarkerSvg),
            new kakao.maps.Size(24, 24),
            { offset: new kakao.maps.Point(12, 12) }
          ),
        });
      } else {
        tapMarker.setPosition(latlng);
      }

      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(
          JSON.stringify({
            type: 'mapClick',
            lat: lat,
            lng: lng,
            utmkX: utmk.x,
            utmkY: utmk.y,
          })
        );
      } else {
        var panel = document.getElementById('coordPanel');
        panel.style.display = 'block';
        panel.innerHTML =
          '<div class="row"><span>위도 ' + lat.toFixed(6) + '</span><span>경도 ' + lng.toFixed(6) + '</span></div>' +
          '<div class="row"><span>UTM-K X ' + utmk.x.toFixed(2) + 'm</span><span>Y ' + utmk.y.toFixed(2) + 'm</span></div>';
      }
    }

    // React Native 쪽에서 injectJavaScript로 호출한다.
    window.setUserLocation = function (lat, lng, accuracy) {
      if (!map) return;
      var position = new kakao.maps.LatLng(lat, lng);

      if (!userMarker) {
        userMarker = new kakao.maps.Marker({ position: position, map: map });
      } else {
        userMarker.setPosition(position);
      }

      var radius = typeof accuracy === 'number' && accuracy > 0 ? accuracy : 0;
      if (!accuracyCircle) {
        accuracyCircle = new kakao.maps.Circle({
          center: position,
          radius: radius,
          strokeWeight: 1,
          strokeColor: '#3478f6',
          strokeOpacity: 0.6,
          fillColor: '#3478f6',
          fillOpacity: 0.15,
          map: map,
        });
      } else {
        accuracyCircle.setPosition(position);
        accuracyCircle.setRadius(radius);
      }

      if (!hasCenteredOnUser) {
        map.setCenter(position);
        hasCenteredOnUser = true;
      }

      if (!isTracking) return;

      // 완전히 같은 좌표일 때만 걸러내면, Wi-Fi/네트워크 기반 위치처럼 거의 똑같은
      // 좌표가 반복될 때 궤적이 한 점에서 멈춘다. 실제 이동 거리(1m 이상)로 판단한다.
      var newUtm = latLngToUtmK(lat, lng);
      var movedEnoughFromLast = !lastTrackedUtm || Math.hypot(newUtm.x - lastTrackedUtm.x, newUtm.y - lastTrackedUtm.y) >= 1;
      if (movedEnoughFromLast) {
        lastTrackedUtm = newUtm;
        userPath.push(position);
        userPathUtm.push(newUtm);
        if (userPath.length >= 2) {
          if (!userTrail) {
            userTrail = new kakao.maps.Polyline({
              map: map,
              path: userPath,
              strokeWeight: 4,
              strokeColor: '#3478f6',
              strokeOpacity: 0.8,
              strokeStyle: 'solid',
            });
          } else {
            userTrail.setPath(userPath);
          }
        }
      }
    };
  </script>
</body>
</html>
